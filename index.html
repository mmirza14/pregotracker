<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Contraction Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent-glow: #e9456080;
    --green: #4ecca3;
    --yellow: #f0c929;
    --red: #e94560;
    --text: #eee;
    --text-dim: #8899aa;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: 16px;
    padding-bottom: 32px;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-dim);
  }

  /* ---- Hospital Alert ---- */
  .hospital-alert {
    display: none;
    background: var(--red);
    color: #fff;
    text-align: center;
    padding: 18px 16px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .hospital-alert.visible { display: block; }
  .hospital-alert small { display: block; font-weight: 400; font-size: 0.85rem; margin-top: 4px; opacity: 0.9; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 24px 8px var(--accent-glow); }
  }

  /* ---- Timer Display ---- */
  .timer-section {
    text-align: center;
    margin-bottom: 20px;
  }
  .timer-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .timer-value {
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }
  .timer-value.active { color: var(--accent); }
  .timer-value.idle { color: var(--green); }

  /* ---- Main Button ---- */
  .btn-main {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 24px;
    padding: 22px;
    border: none;
    border-radius: var(--radius);
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-main:active { transform: scale(0.97); }
  .btn-start {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn-stop {
    background: var(--green);
    color: #1a1a2e;
    box-shadow: 0 4px 20px #4ecca340;
  }

  /* ---- Stats ---- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .stat-card.full-width { grid-column: 1 / -1; }
  .stat-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .status-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-green { background: var(--green); }
  .status-yellow { background: var(--yellow); }
  .status-red { background: var(--red); animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---- History ---- */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .history-header h2 {
    font-size: 1rem;
    font-weight: 600;
  }
  .btn-group { display: flex; gap: 8px; }
  .btn-sm {
    background: var(--surface2);
    color: var(--text);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-sm:active { opacity: 0.7; }
  .btn-danger { background: #5c1a2a; }

  /* ---- Manual Entry ---- */
  .manual-toggle {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 12px;
    background: none;
    border: 1px dashed var(--text-dim);
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .manual-toggle:active { opacity: 0.7; }
  .manual-form {
    display: none;
    max-width: 400px;
    margin: 0 auto 20px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
  }
  .manual-form.visible { display: block; }
  .manual-form label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .manual-form input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ffffff1a;
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .manual-form input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .manual-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .manual-row input { margin-bottom: 0; }
  .manual-row + .btn-manual { margin-top: 12px; }
  .btn-manual {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-manual:active { opacity: 0.7; }

  .history-table-wrap {
    overflow-x: auto;
    border-radius: var(--radius);
    background: var(--surface);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th {
    background: var(--surface2);
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-top: 1px solid #ffffff0a;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<h1>Contraction Tracker</h1>

<div id="hospitalAlert" class="hospital-alert">
  Time to go to the hospital!
  <small>4-1-1 pattern detected</small>
</div>

<div class="timer-section">
  <div class="timer-label" id="timerLabel">Tap to start timing</div>
  <div class="timer-value idle" id="timerValue">00:00</div>
</div>

<button class="btn-main btn-start" id="mainBtn" onclick="toggle()">
  Contraction Started
</button>

<button class="manual-toggle" onclick="toggleManualForm()">+ Add Manual Entry</button>
<div class="manual-form" id="manualForm">
  <label for="manualDate">Date</label>
  <input type="date" id="manualDate">
  <label for="manualTime">Start Time</label>
  <input type="time" id="manualTime" step="1">
  <div class="manual-row">
    <div>
      <label for="manualDurMin">Duration (min)</label>
      <input type="number" id="manualDurMin" min="0" max="59" placeholder="1" inputmode="numeric">
    </div>
    <div>
      <label for="manualDurSec">Duration (sec)</label>
      <input type="number" id="manualDurSec" min="0" max="59" placeholder="0" inputmode="numeric">
    </div>
  </div>
  <button class="btn-manual" onclick="addManualEntry()">Add Contraction</button>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Last Hour</div>
    <div class="stat-value" id="statCount">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Avg Duration</div>
    <div class="stat-value" id="statAvgDur">--:--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Avg Interval</div>
    <div class="stat-value" id="statAvgInt">--:--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">4-1-1 Status</div>
    <div class="stat-value" id="statStatus"><span class="status-indicator status-green"></span>Not yet</div>
  </div>
</div>

<div class="history-header">
  <h2>History</h2>
  <div class="btn-group">
    <button class="btn-sm" onclick="downloadCSV()">Download CSV</button>
    <button class="btn-sm btn-danger" onclick="clearHistory()">Clear</button>
  </div>
</div>

<div class="history-table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Time</th>
        <th>Duration</th>
        <th>Interval</th>
      </tr>
    </thead>
    <tbody id="historyBody">
    </tbody>
  </table>
  <div class="empty-state" id="emptyState">No contractions recorded yet</div>
</div>

<script>
  const STORAGE_KEY = 'contraction_tracker_data';

  let contractions = [];
  let isActive = false;
  let tickInterval = null;

  // --- Persistence ---
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(contractions));
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) contractions = JSON.parse(raw);
    } catch (e) {
      contractions = [];
    }
  }

  // --- Formatting ---
  function fmtDuration(ms) {
    if (ms == null || ms < 0) return '--:--';
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function fmtTime(epoch) {
    const d = new Date(epoch);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const date = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    return date + ' ' + time;
  }

  // --- Core Logic ---
  function toggle() {
    if (!isActive) {
      // Start contraction
      contractions.push({ start: Date.now(), end: null });
      isActive = true;
      save();
    } else {
      // End contraction
      const current = contractions[contractions.length - 1];
      if (current && current.end === null) {
        current.end = Date.now();
      }
      isActive = false;
      save();
    }
    updateUI();
  }

  function updateUI() {
    const btn = document.getElementById('mainBtn');
    const timerLabel = document.getElementById('timerLabel');
    const timerValue = document.getElementById('timerValue');

    if (isActive) {
      btn.textContent = 'Contraction Ended';
      btn.className = 'btn-main btn-stop';
      timerLabel.textContent = 'Contraction duration';
      timerValue.className = 'timer-value active';
    } else {
      btn.textContent = 'Contraction Started';
      btn.className = 'btn-main btn-start';
      if (contractions.length > 0) {
        timerLabel.textContent = 'Time since last contraction';
        timerValue.className = 'timer-value idle';
      } else {
        timerLabel.textContent = 'Tap to start timing';
        timerValue.className = 'timer-value idle';
      }
    }

    updateTimer();
    updateStats();
    renderHistory();
  }

  function updateTimer() {
    const timerValue = document.getElementById('timerValue');
    const now = Date.now();

    if (isActive) {
      const current = contractions[contractions.length - 1];
      if (current) {
        timerValue.textContent = fmtDuration(now - current.start);
      }
    } else if (contractions.length > 0) {
      const last = contractions[contractions.length - 1];
      const ref = last.end || last.start;
      timerValue.textContent = fmtDuration(now - ref);
    } else {
      timerValue.textContent = '00:00';
    }
  }

  function updateStats() {
    const now = Date.now();
    const oneHourAgo = now - 60 * 60 * 1000;

    // Completed contractions in the last hour
    const recent = contractions.filter(c => c.end !== null && c.start >= oneHourAgo);

    // Count
    document.getElementById('statCount').textContent = recent.length;

    // Average duration
    if (recent.length > 0) {
      const avgDur = recent.reduce((sum, c) => sum + (c.end - c.start), 0) / recent.length;
      document.getElementById('statAvgDur').textContent = fmtDuration(avgDur);
    } else {
      document.getElementById('statAvgDur').textContent = '--:--';
    }

    // Average interval
    if (recent.length > 1) {
      let totalInterval = 0;
      for (let i = 1; i < recent.length; i++) {
        totalInterval += recent[i].start - recent[i - 1].start;
      }
      const avgInt = totalInterval / (recent.length - 1);
      document.getElementById('statAvgInt').textContent = fmtDuration(avgInt);
    } else {
      document.getElementById('statAvgInt').textContent = '--:--';
    }

    // 4-1-1 check
    check411(recent);
  }

  function check411(recent) {
    const statusEl = document.getElementById('statStatus');
    const alertEl = document.getElementById('hospitalAlert');

    // Need at least 4 contractions in the last hour
    if (recent.length < 4) {
      statusEl.innerHTML = '<span class="status-indicator status-green"></span>Not yet';
      alertEl.classList.remove('visible');
      return;
    }

    // Average duration >= 1 minute
    const avgDur = recent.reduce((sum, c) => sum + (c.end - c.start), 0) / recent.length;
    const durOk = avgDur >= 60 * 1000;

    // Average interval <= 4 minutes (start-to-start)
    let totalInterval = 0;
    for (let i = 1; i < recent.length; i++) {
      totalInterval += recent[i].start - recent[i - 1].start;
    }
    const avgInt = totalInterval / (recent.length - 1);
    const intOk = avgInt <= 4 * 60 * 1000;

    // Spanning at least ~1 hour (first contraction started at least 50 min ago to allow some tolerance)
    const spanOk = (Date.now() - recent[0].start) >= 50 * 60 * 1000;

    if (durOk && intOk && spanOk) {
      statusEl.innerHTML = '<span class="status-indicator status-red"></span>GO NOW';
      alertEl.classList.add('visible');
      tryVibrate();
    } else if ((durOk && intOk) || (intOk && recent.length >= 4)) {
      statusEl.innerHTML = '<span class="status-indicator status-yellow"></span>Getting close';
      alertEl.classList.remove('visible');
    } else {
      statusEl.innerHTML = '<span class="status-indicator status-green"></span>Not yet';
      alertEl.classList.remove('visible');
    }
  }

  function tryVibrate() {
    if (navigator.vibrate) {
      navigator.vibrate([300, 100, 300, 100, 300]);
    }
  }

  function renderHistory() {
    const tbody = document.getElementById('historyBody');
    const empty = document.getElementById('emptyState');

    if (contractions.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    let html = '';
    // Show most recent first
    for (let i = contractions.length - 1; i >= 0; i--) {
      const c = contractions[i];
      const num = i + 1;
      const time = fmtTime(c.start);
      const dur = c.end ? fmtDuration(c.end - c.start) : 'in progress...';

      let interval = '--';
      if (i > 0) {
        const prev = contractions[i - 1];
        const prevEnd = prev.end || prev.start;
        interval = fmtDuration(c.start - prevEnd);
      }

      html += `<tr>
        <td>${num}</td>
        <td>${time}</td>
        <td>${dur}</td>
        <td>${interval}</td>
      </tr>`;
    }
    tbody.innerHTML = html;
  }

  // --- Manual Entry ---
  function toggleManualForm() {
    document.getElementById('manualForm').classList.toggle('visible');
  }

  function addManualEntry() {
    const timeInput = document.getElementById('manualTime').value;
    const durMin = parseInt(document.getElementById('manualDurMin').value) || 0;
    const durSec = parseInt(document.getElementById('manualDurSec').value) || 0;

    if (!timeInput) { alert('Please enter a start time.'); return; }
    if (durMin === 0 && durSec === 0) { alert('Please enter a duration.'); return; }

    const durationMs = (durMin * 60 + durSec) * 1000;

    // Parse date and time inputs
    const dateInput = document.getElementById('manualDate').value;
    const [h, m, s] = timeInput.split(':').map(Number);
    let startDate;
    if (dateInput) {
      const [y, mo, d] = dateInput.split('-').map(Number);
      startDate = new Date(y, mo - 1, d, h, m, s || 0);
    } else {
      const now = new Date();
      startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s || 0);
    }
    const startMs = startDate.getTime();

    // Don't allow future times
    if (startMs > Date.now()) { alert('Start time cannot be in the future.'); return; }

    const entry = { start: startMs, end: startMs + durationMs };

    // Insert in sorted order by start time
    let inserted = false;
    for (let i = 0; i < contractions.length; i++) {
      if (startMs < contractions[i].start) {
        contractions.splice(i, 0, entry);
        inserted = true;
        break;
      }
    }
    if (!inserted) contractions.push(entry);

    save();
    updateUI();

    // Reset form
    document.getElementById('manualDate').value = '';
    document.getElementById('manualTime').value = '';
    document.getElementById('manualDurMin').value = '';
    document.getElementById('manualDurSec').value = '';
    document.getElementById('manualForm').classList.remove('visible');
  }

  // --- CSV Download ---
  function downloadCSV() {
    if (contractions.length === 0) return;

    let csv = '#,Start Time,End Time,Duration (seconds),Interval (seconds)\n';
    for (let i = 0; i < contractions.length; i++) {
      const c = contractions[i];
      const num = i + 1;
      const start = new Date(c.start).toLocaleString();
      const end = c.end ? new Date(c.end).toLocaleString() : 'in progress';
      const dur = c.end ? ((c.end - c.start) / 1000).toFixed(0) : '';

      let interval = '';
      if (i > 0) {
        const prev = contractions[i - 1];
        const prevEnd = prev.end || prev.start;
        interval = ((c.start - prevEnd) / 1000).toFixed(0);
      }

      csv += `${num},"${start}","${end}",${dur},${interval}\n`;
    }

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `contractions-${dateStr}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // --- Clear ---
  function clearHistory() {
    if (!confirm('Clear all contraction history?')) return;
    contractions = [];
    isActive = false;
    save();
    updateUI();
  }

  // --- Tick ---
  function startTick() {
    tickInterval = setInterval(() => {
      updateTimer();
      updateStats();
    }, 1000);
  }

  // --- Restore active state on load ---
  function restoreActiveState() {
    if (contractions.length > 0) {
      const last = contractions[contractions.length - 1];
      if (last.end === null) {
        isActive = true;
      }
    }
  }

  // --- Init ---
  load();
  restoreActiveState();
  updateUI();
  startTick();
</script>
</body>
</html>
